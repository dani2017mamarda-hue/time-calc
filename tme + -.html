<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>დროის კალკულატორი</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 360px;
    }
    h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
      color: #1a1a1a;
      text-align: center;
    }
    .group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e1e4e8;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }
    input:focus {
      border-color: #2563eb;
    }
    .row {
      display: flex;
      gap: 12px;
    }
    .row > div {
      flex: 1;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-add {
      background-color: #2563eb;
      color: white;
    }
    .btn-add:hover {
      background-color: #1d4ed8;
    }
    .btn-sub {
      background-color: #f3f4f6;
      color: #1f2937;
      border: 1px solid #d1d5db;
    }
    .btn-sub:hover {
      background-color: #e5e7eb;
    }
    .result-box {
      margin-top: 22px;
      padding: 16px;
      background-color: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      text-align: center;
      display: none;
    }
    .result-time {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
    }
    .result-day {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 600;
      color: #2563eb;
    }
    .error {
      color: #dc2626;
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>დროის კალკულატორი</h2>

  <div class="group">
    <label for="startTime">საწყისი დრო</label>
    <input type="text" id="startTime" placeholder="მაგ: 13:00" maxlength="5" oninput="formatTimeInput(this)">
  </div>

  <div class="row group">
    <div>
      <label for="hours">საათი</label>
      <input type="number" id="hours" placeholder="" min="0">
    </div>
    <div>
      <label for="minutes">წუთი</label>
      <input type="number" id="minutes" placeholder="" min="0">
    </div>
  </div>

  <div class="buttons">
    <button class="btn-add" onclick="calculate(1)">+ დამატება</button>
    <button class="btn-sub" onclick="calculate(-1)">− გამოკლება</button>
  </div>

  <div id="errorMsg" class="error">გთხოვთ შეიყვანოთ სწორი დრო (მაგ: 13:00)</div>

  <div id="resultBox" class="result-box">
    <div id="resultTime" class="result-time"></div>
    <div id="resultDay" class="result-day"></div>
  </div>
</div>

<script>
  function formatTimeInput(input) {
    let val = input.value.replace(/\D/g, '');
    if (val.length >= 3) {
      val = val.slice(0, 2) + ':' + val.slice(2, 4);
    }
    input.value = val;
  }

  function calculate(direction) {
    const timeStr = document.getElementById('startTime').value.trim();
    const hInput = parseInt(document.getElementById('hours').value) || 0;
    const mInput = parseInt(document.getElementById('minutes').value) || 0;

    const errorEl = document.getElementById('errorMsg');
    const resultBox = document.getElementById('resultBox');

    const parts = timeStr.split(':');
    if (parts.length !== 2) {
      errorEl.style.display = 'block';
      resultBox.style.display = 'none';
      return;
    }

    const startH = parseInt(parts[0], 10);
    const startM = parseInt(parts[1], 10);

    if (isNaN(startH) || isNaN(startM) || startH < 0 || startH > 23 || startM < 0 || startM > 59) {
      errorEl.style.display = 'block';
      resultBox.style.display = 'none';
      return;
    }

    errorEl.style.display = 'none';

    const startTotalMins = (startH * 60) + startM;
    const deltaMins = ((hInput * 60) + mInput) * direction;
    const finalTotalMins = startTotalMins + deltaMins;

    const dayDiff = Math.floor(finalTotalMins / 1440);
    const normalizedMins = ((finalTotalMins % 1440) + 1440) % 1440;

    const resH = String(Math.floor(normalizedMins / 60)).padStart(2, '0');
    const resM = String(normalizedMins % 60).padStart(2, '0');

    let dayText = 'იმავე დღეს';
    if (dayDiff === 1) {
      dayText = 'მომდევნო დღეს (+1 დღე)';
    } else if (dayDiff > 1) {
      dayText = `${dayDiff} დღის შემდეგ (+${dayDiff} დღე)`;
    } else if (dayDiff === -1) {
      dayText = 'წინა დღეს (-1 დღე)';
    } else if (dayDiff < -1) {
      dayText = `${Math.abs(dayDiff)} დღის წინ (${dayDiff} დღე)`;
    }

    document.getElementById('resultTime').innerText = `${resH}:${resM}`;
    document.getElementById('resultDay').innerText = dayText;
    resultBox.style.display = 'block';
  }
</script>

</body>
</html>
